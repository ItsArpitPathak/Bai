spring.application.name=backend
# Local default: file H2. Deploy with SPRING_DATASOURCE_URL/USERNAME/PASSWORD to use Postgres.
spring.datasource.url=jdbc:h2:file:./data/bai
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# AI generate (optional): set GEMINI_API_KEY in the environment to enable POST /generate
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
